# Switch to a window's workspace when activated (e.g. taskbar click)
focus_on_window_activation focus

# Prevent Chrome from stealing focus across workspaces
for_window [app_id="google-chrome"] focus_on_window_activation none
for_window [app_id="^chrome-.*-Default$"] focus_on_window_activation none

# Remove title bar from Chrome PWA apps
for_window [app_id="^chrome-.*-Default$"] default_border pixel 1

# Diary terminal placement is handled by diary-cron.sh (numbered workspace)

# Calendar popup from waybar clock
for_window [title="calendar-popup"] floating enable, border none, move position cursor, opacity 0

# PR monitor legend
for_window [title="PR Monitor Legend"] floating enable, resize set 700 650
