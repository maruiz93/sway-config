# Basics
bindsym $mod+Return exec ~/.config/sway/scripts/launchers/launch-claude.sh
bindsym $mod+Shift+Return exec $term
bindsym $mod+Shift+q kill
bindsym $mod+d exec $menu
bindsym $mod+Shift+c reload
bindsym $mod+Shift+e exec swaynag -t warning -m 'Exit sway?' -B 'Yes' 'swaymsg exit'
floating_modifier $mod normal

# Lock screen
bindsym $mod+Escape exec $lockscreen

# Screenshots
bindsym Print exec $screenshot
bindsym $mod+Print exec $screenshot_clip
bindsym $mod+Shift+Print exec $screenshot_edit

# Focus
bindsym $mod+$left focus left
bindsym $mod+$down focus down
bindsym $mod+$up focus up
bindsym $mod+$right focus right
bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right

# Move windows
bindsym $mod+Shift+$left move left
bindsym $mod+Shift+$down move down
bindsym $mod+Shift+$up move up
bindsym $mod+Shift+$right move right
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right

# Layout
bindsym $mod+b splith
bindsym $mod+v splitv
bindsym $mod+s layout stacking
bindsym $mod+w layout tabbed
bindsym $mod+e layout toggle split
bindsym $mod+f fullscreen
bindsym $mod+Shift+space floating toggle
bindsym $mod+space focus mode_toggle
bindsym $mod+a focus parent

# Multi-monitor
bindsym $mod+o exec ~/.config/sway/scripts/workspaces/other-output.sh focus
bindsym $mod+Shift+o exec ~/.config/sway/scripts/workspaces/other-output.sh "move container to"
bindsym $mod+Ctrl+o exec ~/.config/sway/scripts/workspaces/other-output.sh "move workspace to"

# Workspace cycling
bindsym $mod+Tab workspace next_on_output
bindsym $mod+Shift+Tab workspace prev_on_output

# Scratchpad
bindsym $mod+Shift+minus move scratchpad
bindsym $mod+minus scratchpad show

# Resize mode
mode "resize" {
    bindsym $left resize shrink width 10px
    bindsym $down resize grow height 10px
    bindsym $up resize shrink height 10px
    bindsym $right resize grow width 10px
    bindsym Left resize shrink width 10px
    bindsym Down resize grow height 10px
    bindsym Up resize shrink height 10px
    bindsym Right resize grow width 10px
    bindsym Return mode "default"
    bindsym Escape mode "default"
}
bindsym $mod+r mode "resize"

# Media & brightness keys
bindsym --locked XF86AudioMute exec pactl set-sink-mute @DEFAULT_SINK@ toggle
bindsym --locked XF86AudioLowerVolume exec pactl set-sink-volume @DEFAULT_SINK@ -5%
bindsym --locked XF86AudioRaiseVolume exec pactl set-sink-volume @DEFAULT_SINK@ +5%
bindsym --locked XF86AudioMicMute exec pactl set-source-mute @DEFAULT_SOURCE@ toggle
bindsym --locked XF86AudioPlay exec playerctl play-pause
bindsym --locked XF86AudioPause exec playerctl play-pause
bindsym --locked XF86AudioStop exec playerctl stop
bindsym --locked XF86AudioNext exec playerctl next
bindsym --locked XF86AudioPrev exec playerctl previous
bindsym --locked XF86MonBrightnessDown exec brightnessctl set 5%-
bindsym --locked XF86MonBrightnessUp exec brightnessctl set 5%+

# Kitty font size with scroll
bindsym --whole-window Ctrl+Shift+button4 exec ~/.config/sway/scripts/ux/kitty-font-size.sh +1
bindsym --whole-window Ctrl+Shift+button5 exec ~/.config/sway/scripts/ux/kitty-font-size.sh -1

# Touchpad gestures
bindgesture swipe:3:right workspace prev
bindgesture swipe:3:left workspace next

# Clipboard history
bindsym $mod+c exec cliphist list | fuzzel --dmenu --prompt "Clipboard " | cliphist decode | wl-copy

# New workspace (first free number)
bindsym $mod+n exec ~/.config/sway/scripts/workspaces/new-workspace.sh
bindsym $mod+Shift+n exec ~/.config/sway/scripts/workspaces/move-to-new-workspace.sh

# Renumber workspaces to close gaps
bindsym $mod+Ctrl+n exec ~/.config/sway/scripts/workspaces/renumber-workspaces.sh

# Rename current workspace
bindsym $mod+comma exec ~/.config/sway/scripts/workspaces/rename-workspace.sh
bindsym $mod+Shift+comma exec swaymsg "rename workspace to $(swaymsg -t get_workspaces | jq -r '.[] | select(.focused).num')"

# Help
bindsym $mod+question exec ~/.config/sway/scripts/launchers/cheatsheet.sh

# Pin window (stay opaque when unfocused)
bindsym $mod+p exec ~/.config/sway/scripts/ux/toggle-pin.sh

# Timer
bindsym $mod+t exec ~/.config/waybar/timer.sh start

# PR dashboard
bindsym $mod+m exec ~/.local/bin/pr-monitor-launch.sh
bindsym $mod+Shift+m exec ~/.local/bin/pr-monitor-legend.sh
