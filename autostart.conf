# Idle & Lock (CSB requires 15-minute lock)
exec swayidle -w \
    timeout 900 '$lockscreen' \
    timeout 1200 'swaymsg "output * power off"' \
        resume 'swaymsg "output * power on"' \
    before-sleep '$lockscreen'

# Services
exec_always bash -c 'pkill -x kanshi; sleep 0.5; kanshi &'
exec wl-paste --watch cliphist store
exec_always bash -c 'systemctl --user import-environment SWAYSOCK WAYLAND_DISPLAY DISPLAY XDG_RUNTIME_DIR PATH && systemctl --user restart waybar-auto-collapse'
exec swaync
exec ~/.config/sway/scripts/ux/clear-slack-on-focus.sh
exec sleep 2 && nm-applet --indicator
exec blueman-applet
exec bash -c 'source ~/.config/sway/location.conf && wlsunset -l $LAT -L $LON -t $TEMP_NIGHT -T $TEMP_DAY'
exec_always bash -c 'pkill -f touchpad-scroll-tracker; sleep 0.3; python3 ~/.config/waybar/touchpad-scroll-tracker.py &'
exec_always ~/.config/sway/scripts/ux/opacity.sh
exec_always bash -c 'pkill -f github-workspace-fix; sleep 0.3; ~/.config/sway/scripts/ux/github-workspace-fix.sh &'
exec /usr/libexec/deja-dup/deja-dup-monitor
exec ~/.config/sway/scripts/ux/battery-monitor.sh
exec_always ~/.config/waybar/claude-status-wrapper.sh
